name: Build Custom No-Telemetry EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Скачивание исходного кода
      uses: actions/checkout@v4

    - name: 2. Безопасный патч исходников (Отключение телеметрии на уровне бэкенда)
      shell: pwsh
      run: |
        Write-Host "=== Поиск и модификация файлов телеметрии ===" -ForegroundColor Cyan
        Get-ChildItem -Path . -Recurse -Filter *.qml | ForEach-Object {
          $content = Get-Content $_.FullName -Raw -Encoding UTF8
          if ($content -match "telemetry") {
            Write-Host "Патчим QML UI: $($_.FullName)" -ForegroundColor Green
            $patched = $content -replace 'telemetry\.mode', '"off"'
            Set-Content -Path $_.FullName -Value $patched -Encoding UTF8
          }
        }
        Get-ChildItem -Path . -Recurse -Include *.cpp, *.h, *.hpp | ForEach-Object {
          $content = Get-Content $_.FullName -Raw -Encoding UTF8
          if ($content -match "telemetry" -or $content -match '"basic"' -or $content -match '"extended"') {
            Write-Host "Патчим C++ логику: $($_.FullName)" -ForegroundColor Green
            $patched = $content -replace '"basic"', '"off"'
            $patched = $patched -replace '"extended"', '"off"'
            Set-Content -Path $_.FullName -Value $patched -Encoding UTF8
          }
        }
        Write-Host "=== Изменения в коде (git diff): ===" -ForegroundColor Yellow
        git diff

    - name: 3. Установка стабильной версии Python (для корректной работы aqt)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 4. Установка Qt 6 в облаке
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.1'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtmultimedia qtwebsockets qt5compat'
        setup-python: false

    - name: 5. Настройка компилятора Visual Studio (MSVC x64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 6. Сборка зависимости pjproject (PJSIP)
      shell: pwsh
      run: |
        Write-Host "=== Сборка pjproject (PJSIP) ===" -ForegroundColor Cyan
        if (Test-Path "scripts/build-pjproject.ps1") {
            powershell -ExecutionPolicy Bypass -File scripts/build-pjproject.ps1
        } else {
            Write-Host "Скрипт scripts/build-pjproject.ps1 не найден. Пропускаем." -ForegroundColor Yellow
        }

    - name: 7. Сборка проекта через CMake
      shell: pwsh
      run: |
        if (Test-Path "vcpkg.json") {
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        } else {
            cmake -B build -DCMAKE_BUILD_TYPE=Release
        }
        cmake --build build --config Release --parallel

    # >>> НОВЫЙ ШАГ: Сборка самодостаточной портативной папки <<<
    - name: 8. Упаковка портативной версии (windeployqt + плагины + OpenSSL)
      shell: pwsh
      run: |
        $Stage = "dist"
        New-Item -ItemType Directory -Path $Stage -Force | Out-Null
        
        # 1. Основные бинарники (exe + dll ядра) рядом друг с другом
        Copy-Item -Path "build\bin\Release\*" -Destination $Stage -Recurse -Force
        
        # 2. Плагины: сохраняем исходную структуру И дублируем в plugins/ рядом с exe
        if (Test-Path "build\lib\ai-softphone") {
            Copy-Item -Path "build\lib\ai-softphone" -Destination "$Stage\lib\ai-softphone" -Recurse -Force
            $pluginsRoot = (Resolve-Path "build\lib\ai-softphone\plugins").Path
            Get-ChildItem -Path $pluginsRoot -Recurse -Filter *.dll | ForEach-Object {
                $rel = $_.FullName.Substring($pluginsRoot.Length + 1)
                $dest = Join-Path "$Stage\plugins" $rel
                New-Item -ItemType Directory -Path (Split-Path $dest) -Force | Out-Null
                Copy-Item $_.FullName -Destination $dest -Force
            }
        }
        
        # 3. windeployqt подтягивает Qt6Core, Qt6Qml, Qt6QuickControls2, platforms/, qml/ и рантайм MSVC
        & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --qmldir "ui\qml" "$Stage\ai-softphone.exe"
        
        # 4. DLL OpenSSL (нужны для SIP/TLS)
        Copy-Item "C:\Program Files\OpenSSL\bin\*.dll" -Destination $Stage -Force -ErrorAction SilentlyContinue
        
        Write-Host "=== Содержимое папки dist: ===" -ForegroundColor Cyan
        Get-ChildItem $Stage | Select-Object Name

    - name: 9. Выгрузка готовой портативной папки в Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-softphone-no-telemetry-win64
        path: dist
